name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dental_care_app

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Dart Code
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run Unit Tests
        run: flutter test --no-pub || true

      - name: 🔨 Build Android Release APK
        run: |
          chmod +x android/gradlew
          flutter build apk --release --android-skip-build-dependency-validation 2>&1 | tee build.log || {
            echo "### ❌ Build Log Tail" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          }

      - name: 📋 Rename APK for clarity
        run: |
          mkdir -p ../dist
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" ../dist/Manjaly-Dental-Care-v1.0.1.apk
            cp "build/app/outputs/flutter-apk/app-release.apk" ../dist/Manjaly-Dental-Care-v1.0.0.apk
            cp "build/app/outputs/flutter-apk/app-release.apk" ../dist/Manjaly-Dental-Care.apk
          elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            cp "build/app/outputs/apk/release/app-release.apk" ../dist/Manjaly-Dental-Care-v1.0.1.apk
            cp "build/app/outputs/apk/release/app-release.apk" ../dist/Manjaly-Dental-Care-v1.0.0.apk
            cp "build/app/outputs/apk/release/app-release.apk" ../dist/Manjaly-Dental-Care.apk
          else
            find build -type f -name "*release*.apk" -exec cp {} ../dist/Manjaly-Dental-Care-v1.0.1.apk \;
            find build -type f -name "*release*.apk" -exec cp {} ../dist/Manjaly-Dental-Care-v1.0.0.apk \;
          fi
          ls -la ../dist/

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Manjaly-Dental-Care-Release-APK
          path: |
            dist/*.apk
            dental_care_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 🚀 Release APK via GitHub CLI (with asset clobber)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          cd "$GITHUB_WORKSPACE"
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}"
          echo "Releasing APKs under tag $TAG for $GH_REPO..."
          gh release create "$TAG" dist/Manjaly-Dental-Care-v1.0.1.apk dist/Manjaly-Dental-Care-v1.0.0.apk dist/Manjaly-Dental-Care.apk --title "Release $TAG" --notes "🦷 Manjaly Dental Care - Android Release APK" --latest || \
          gh release upload "$TAG" dist/Manjaly-Dental-Care-v1.0.1.apk dist/Manjaly-Dental-Care-v1.0.0.apk dist/Manjaly-Dental-Care.apk --clobber
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Create or Update GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          files: |
            dist/Manjaly-Dental-Care-v1.0.1.apk
            dist/Manjaly-Dental-Care-v1.0.0.apk
            dist/Manjaly-Dental-Care.apk
          name: Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          body: |
            ## 🦷 Manjaly Dental Care - Android Release

            ### ✨ Features
            - Complete offline-first dental clinic management app (no backend required).
            - Patient Registration & Revisit consultation.
            - Appointments & Calendar portal with date filtering.
            - Real-time billing & instant branded invoices with treatments, consultation, and charges.
            - Accounts & Revenue analytics dashboard with category breakdown.
            - Pharmacy & dental stock management with low-stock alerts.

            ### 📲 Download & Install
            Download **`Manjaly-Dental-Care-v1.0.0.apk`** below and install it directly on any Android device (Android 5.0 Lollipop and above).
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
