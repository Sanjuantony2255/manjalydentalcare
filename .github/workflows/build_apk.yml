name: Build & Release Flutter APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dental_care_app

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 🧹 Flutter Clean
        run: flutter clean

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔍 Analyze Dart Code
        run: flutter analyze --no-fatal-infos

      - name: 🧪 Run Unit Tests
        run: flutter test --no-pub || true

      - name: 🔨 Build Android Release APK
        run: |
          set -o pipefail
          chmod +x android/gradlew
          flutter build apk --release --android-skip-build-dependency-validation --no-tree-shake-icons 2>&1 | tee build.log || {
            cat build.log
            exit 1
          }

      - name: 📋 Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: dental_care_app/build.log

      - name: 📋 Rename APK for clarity
        run: |
          mkdir -p ../dist
          APK_SRC=""
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            APK_SRC="build/app/outputs/flutter-apk/app-release.apk"
          elif [ -f "build/app/outputs/apk/release/app-release.apk" ]; then
            APK_SRC="build/app/outputs/apk/release/app-release.apk"
          else
            APK_SRC=$(find build -type f -name "*release*.apk" | head -n 1)
          fi
          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "❌ Release APK not found in build outputs!"
            exit 1
          fi
          echo "Found APK at $APK_SRC, copying to ../dist..."
          cp "$APK_SRC" ../dist/Manjaly-Dental-Care-v1.0.1.apk
          cp "$APK_SRC" ../dist/Manjaly-Dental-Care-v1.0.0.apk
          cp "$APK_SRC" ../dist/Manjaly-Dental-Care.apk
          ls -la ../dist/

      - name: 📤 Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Manjaly-Dental-Care-Release-APK
          path: |
            dist/*.apk
            dental_care_app/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: 🚀 Publish APK to GitHub Releases via Python Script
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 scripts/upload_release.py dist/Manjaly-Dental-Care-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: 🚀 Create or Update GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          files: |
            dist/Manjaly-Dental-Care-v1.0.1.apk
            dist/Manjaly-Dental-Care-v1.0.0.apk
            dist/Manjaly-Dental-Care.apk
          name: Release ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          body: |
            ## 🦷 Manjaly Dental Care - Android Release

            ### ✨ Features
            - Complete offline-first dental clinic management app (no backend required).
            - Patient Registration & Revisit consultation.
            - Appointments & Calendar portal with date filtering.
            - Real-time billing & instant branded invoices with treatments, consultation, and charges.
            - Accounts & Revenue analytics dashboard with category breakdown.
            - Pharmacy & dental stock management with low-stock alerts.

            ### 📲 Download & Install
            Download **`Manjaly-Dental-Care-v1.0.1.apk`** (or **`Manjaly-Dental-Care-v1.0.0.apk`**) below and install it directly on any Android device (Android 5.0 Lollipop and above).
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
