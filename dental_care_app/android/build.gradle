allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name.startsWith('kotlin-stdlib')) {
                details.useVersion '1.9.24'
            }
            if (details.requested.group == 'androidx.annotation' && details.requested.name == 'annotation-jvm') {
                details.useVersion '1.8.2'
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
                compileSdkVersion 34
                buildToolsVersion "34.0.0"
            }
        }
    }
    tasks.configureEach { task ->
        if (task.name.toLowerCase().contains("kotlin")) {
            try {
                task.kotlinOptions.freeCompilerArgs += ["-Xskip-metadata-version-check"]
            } catch (Exception ignored) {}
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
